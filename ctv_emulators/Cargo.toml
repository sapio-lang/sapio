[package]
rust-version.workspace = true
name = "ctv_emulators"
version = "0.2.4"
license = "MPL-2.0"
authors = ["Jeremy Rubin <j@rubin.io>"]
edition = "2021"
repository = "https://github.com/sapio-lang/sapio"
homepage = "https://sapio-lang.org"
description = "Implementation of the CTV Emulator Trait"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
tokio = { version = "1", features = ["full"] }
schemars = { version = "=1.2.2", features = ["bitcoin032", "miniscript13"] }
serde_json = "1.0"
serde = "1.0"
serde_derive = "1.0"
rand = "0.8.1"
wasmer = "=7.4.0"
wasmer-middlewares = "=6.1.0"
sapio-wasm = { path = "../wasm", features = ["host"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wat = "=1.258.0"


[dependencies.sapio-ctv-emulator-trait]
path = "../emulator-trait"
version = "0.2.0"

[dependencies.bitcoin]
version = "=0.32.102"
features = ['serde', 'rand']

[dependencies.sapio-base]
path = "../sapio-base"
version = "0.2.0"

[dependencies.sapio-psbt]
path = "../sapio-psbt"
version = "0.2.0"


[lib]
name = "emulator_connect"
path = "src/lib.rs"

[[bin]]
name = "emulator_server"
path = "src/bin/main.rs"
