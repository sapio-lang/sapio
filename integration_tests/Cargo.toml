[package]
rust-version.workspace = true
name = "sapio_integration_tests"
version = "0.2.0"
authors = ["Jeremy Rubin <j@rubin.io>"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
schemars = { version = "=1.2.2", features = ["bitcoin032", "miniscript13"] }
serde_json = "1.0"
serde = "1.0"
serde_derive = "1.0"
rand = "0.8.1"
base64 = "0.13.0"
sapio-psbt = { path = "../sapio-psbt" }

[dependencies.sapio]
path = "../sapio"

[dependencies.ctv_emulators]
path = "../ctv_emulators"

[dependencies.sapio-ctv-emulator-trait]
path = "../emulator-trait"
version = "0.2.0"

[dependencies.bitcoin]
version = "=0.32.102"
features = ['serde', 'rand', 'base64']

[dependencies.miniscript]
version = "=13.1.0"
features = ['compiler', 'rand', 'serde']

[dependencies.sapio-base]
path = "../sapio-base"
version = "0.2.0"
