[workspace]
members = ["sapio"
          , "sapio-contrib"
          , "ctv_emulators"
          , "sapio-base"
          , "cli"
          , "tools"
          , "plugins"
          , 'emulator-trait'
          , 'examples/*'
          , 'sapio-trait'
          , 'sapio_macros'
          , 'sapio-psbt'
          , 'simp-pack'
          , 'integration_tests']
exclude = ["plugin-example"]
resolver = "2"

[workspace.package]
rust-version = "1.98.1"

[patch.crates-io]
# CTV finalization and inscription correctness repairs in the owned fork.
sapio-miniscript = { git = "https://github.com/sapio-lang/rust-miniscript", rev = "4b30433f0b64f374a0314be25aafd32d1c0218a8" }
