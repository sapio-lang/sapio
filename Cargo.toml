[workspace]
members = ["sapio"
          , "sapio-contrib"
          , "ctv_emulators"
          , "sapio-base"
          , "cli"
          , "tools"
          , "plugins"
          , "wasm"
          , 'emulator-trait'
          , 'examples/*'
          , 'sapio_macros'
          , 'sapio-psbt'
          , 'simp-pack'
          , 'integration_tests']
exclude = ["plugin-example", "evaluators"]
resolver = "2"

[workspace.package]
rust-version = "1.98.1"

[patch.crates-io]
# Canonical BIP341 signature parsing and sighash validation.
sapio-bitcoin = { git = "https://github.com/sapio-lang/rust-bitcoin", rev = "16c1b0059ecb420eaed089da28f8d24f99e36cf8" }
# CTV finalization and inscription correctness repairs in the owned fork.
sapio-miniscript = { git = "https://github.com/sapio-lang/rust-miniscript", rev = "04b69f69459fe3b043ca61fb649cf546d5a241b6" }
