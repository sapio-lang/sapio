[workspace]
members = ["sapio"
          , "sapio-contrib"
          , "ctv_emulators"
          , "sapio-base"
          , "cli"
          , "tools"
          , "plugins"
          , 'emulator-trait'
          , 'examples/*'
          , 'sapio-trait'
          , 'sapio_macros'
          , 'sapio-psbt'
          , 'simp-pack'
          , 'integration_tests']
exclude = ["plugin-example"]
resolver = "2"

[workspace.package]
rust-version = "1.98.1"
