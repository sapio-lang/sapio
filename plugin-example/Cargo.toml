[workspace]
resolver = "2"
members = ["treepay"
          , "trampolinepay"
          , "batching-trait"
          , "vault"
          , "staker"
          , "coin_pool"
          , "fedpeg"
          , "helloworld"
          , "op_return_chain"
          , "hanukkiah"
          , "payment_pool"
          , "jamesob-vault"
          , "nft-trait"
          , "nft"
          , "nft-sale"
          , "nft-auction"
          , "clause-module"
          , "clause-module-trampoline"
          , "ordinal-example"
          , "ordinal-inscription"
          , "custom-policy"
          , "program-policy"]

[patch.crates-io]
# Upstream Bitcoin 0.32.102 with strict Taproot signature and PSBT decoding.
bitcoin = { git = "https://github.com/sapio-lang/rust-bitcoin", rev = "6ef940bb2d98ba5dece053fdabd1d9ad65ff5864" }
# Keep Bitcoin and its upstream secp256k1 dependency on the same hash types.
bitcoin_hashes = { git = "https://github.com/sapio-lang/rust-bitcoin", rev = "6ef940bb2d98ba5dece053fdabd1d9ad65ff5864" }
# Sapio covenant and inscription extensions rebased onto Miniscript 13.1.0.
miniscript = { git = "https://github.com/sapio-lang/rust-miniscript", rev = "8d2aa4a60979a55f6ecd6222d48f94a482f4a2f6" }

# Shared schema trait with opt-in Bitcoin and Miniscript implementations.
schemars = { git = "https://github.com/sapio-lang/sapio-jsonschema", rev = "ba2b06d0181a92ce5b4fddd86977f480cb9d086a" }
schemars_derive = { git = "https://github.com/sapio-lang/sapio-jsonschema", rev = "ba2b06d0181a92ce5b4fddd86977f480cb9d086a" }
