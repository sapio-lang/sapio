[package]
rust-version.workspace = true
name = "sapio"
version = "0.2.4"
license = "MPL-2.0"
authors = ["Jeremy Rubin <j@rubin.io>"]
edition = "2021"
repository = "https://github.com/sapio-lang/sapio"
homepage = "https://sapio-lang.org"
description = "A programming framework for bitcoin smart contracts."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html



[dependencies]
serde_json = "1.0"
serde_derive = "1.0"
paste = "1.0"
base64 = "0.13.0"
lazy_static = "1.4.0"


[dependencies.serde]
version = "1.0"

[dependencies.schemars]
version = "=1.2.2"
features = ["derive", "bitcoin032", "miniscript13"]

[dependencies.bitcoin]
version = "=0.32.102"
features = ['serde']


[dependencies.sapio-base]
path = "../sapio-base"
version = "0.2.0"

[dependencies.sapio-ctv-emulator-trait]
path = "../emulator-trait"
version = "0.2.0"

[dependencies.sapio_macros]
path = "../sapio_macros"
version = "0.2.0"
