[package]
rust-version.workspace = true
name = "simp-pack"
version = "0.2.4"
edition = "2021"
repository = "https://github.com/sapio-lang/sapio"
homepage = "https://sapio-lang.org"
description = "Starter Pack of Sapio Interactive Metadata Protocols; currently non-standardized"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
schemars = { version = "=1.2.2", features = ["bitcoin032", "miniscript13"] }
serde_json = "1.0"
serde = "1.0"
serde_derive = "1.0"
[dependencies.sapio-base]
path = "../sapio-base"
version = "0.2.0"

[dependencies.bitcoin]
version = "=0.32.102"
features = ['serde']
