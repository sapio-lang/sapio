name: Continuous integration

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show
      - run: cargo test --workspace --all-features --locked

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path plugin-example/Cargo.toml --all -- --check
      - run: cargo check -p sapio-wasm-plugin --no-default-features --locked
      - run: cargo check -p sapio-wasm-plugin --no-default-features --features host --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: mdbook build docs/learn-sapio

  wasm:
    runs-on: ubuntu-24.04
    env:
      CC_wasm32_unknown_unknown: clang
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: bash contrib/sapio_wasm.sh
