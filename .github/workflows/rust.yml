name: Continuous integration

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show
      - run: cargo test --workspace --all-features --locked
      - run: cargo test -p sapio --example payment --locked
      - name: Build the developer CLI
        run: cargo build --locked -p sapio-cli
      - name: Run the generated quickstart outside the workspace
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python3 contrib/check_quickstart.py target/debug/sapio-cli
      - name: Install pinned Bitcoin Core
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/bitcoin.tar.gz" \
            https://bitcoincore.org/bin/bitcoin-core-31.1/bitcoin-31.1-x86_64-linux-gnu.tar.gz
          echo "b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e  $RUNNER_TEMP/bitcoin.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/bitcoin.tar.gz" -C "$RUNNER_TEMP"
      - name: Build custom policy spend vectors
        if: runner.os == 'Linux'
        run: cargo build --locked -p sapio --example custom_policy_vectors
      - name: Build program emulation spend vectors
        if: runner.os == 'Linux'
        run: cargo build --locked -p sapio_integration_tests --example program_emulation_vectors
      - name: Build covenant fragment spend vectors
        if: runner.os == 'Linux'
        run: cargo build --locked -p sapio_integration_tests --example covenant_fragment_vectors
      - name: Build eltoo contest scenario
        if: runner.os == 'Linux'
        run: cargo build --locked -p sapio_integration_tests --example eltoo_vectors
      - name: Validate custom policy witnesses with Bitcoin Core
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: >-
          python3 contrib/check_custom_policy.py
          "$RUNNER_TEMP/bitcoin-31.1/bin/bitcoind"
          "$RUNNER_TEMP/bitcoin-31.1/bin/bitcoin-cli"
          target/debug/examples/custom_policy_vectors
      - name: Validate program emulation witnesses with Bitcoin Core
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: >-
          python3 contrib/check_custom_policy.py
          "$RUNNER_TEMP/bitcoin-31.1/bin/bitcoind"
          "$RUNNER_TEMP/bitcoin-31.1/bin/bitcoin-cli"
          target/debug/examples/program_emulation_vectors
      - name: Validate covenant fragments and annexes with Bitcoin Core
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: >-
          python3 contrib/check_custom_policy.py --accept-nonstandard
          "$RUNNER_TEMP/bitcoin-31.1/bin/bitcoind"
          "$RUNNER_TEMP/bitcoin-31.1/bin/bitcoin-cli"
          target/debug/examples/covenant_fragment_vectors
      - name: Verify stale-state override and settlement with Bitcoin Core
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: >-
          python3 contrib/check_eltoo.py
          "$RUNNER_TEMP/bitcoin-31.1/bin/bitcoind"
          "$RUNNER_TEMP/bitcoin-31.1/bin/bitcoin-cli"
          target/debug/examples/eltoo_vectors

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path plugin-example/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path evaluators/Cargo.toml --all -- --check
      - name: Verify distributed evaluator WASM bytes
        run: bash evaluators/build.sh --check
      - name: Test the covenant fragment guest SDK
        run: cargo test --manifest-path evaluators/Cargo.toml -p sapio-covenant-fragments --locked
      - run: cargo check -p sapio-wasm-plugin --no-default-features --locked
      - run: cargo check -p sapio-wasm-plugin --no-default-features --features host --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: mdbook build docs/learn-sapio

  wasm:
    runs-on: ubuntu-24.04
    env:
      CC_wasm32_unknown_unknown: clang
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: bash contrib/sapio_wasm.sh

  build-a-vault:
    name: Build-a-vault modules and custody recipes
    runs-on: ubuntu-24.04
    env:
      CC_wasm32_unknown_unknown: clang
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - name: Check custody building-block formatting
        run: cargo fmt --manifest-path contrib/build-a-vault/Cargo.toml --all -- --check
      - name: Test custody building blocks
        run: cargo test --manifest-path contrib/build-a-vault/Cargo.toml --workspace --locked
      - name: Build the current CLI
        run: cargo build --locked -p sapio-cli
      - name: Build all WASM blocks and execute custody recipes
        run: >-
          python3 contrib/build-a-vault/build.py
          --cli "$GITHUB_WORKSPACE/target/debug/sapio-cli"
          --workspace "$RUNNER_TEMP/build-a-vault-modules"
          --output "$RUNNER_TEMP/build-a-vault"
          --target-dir "$GITHUB_WORKSPACE/target"
      - name: Compare native and WASM custody programs
        run: >-
          cargo run --manifest-path contrib/build-a-vault/Cargo.toml
          --locked -p build-a-vault-emulation --bin check-native --
          "$RUNNER_TEMP/build-a-vault"
      - name: Check out the typed Studio patch engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sapio-lang/sapio-studio
          ref: 337dc9bb80a18f7b4331bce8fa1da9f87e3ab457
          path: contrib/build-a-vault/target/studio
      - name: Install Studio's Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contrib/build-a-vault/target/studio/package-lock.json
      - name: Build Studio's bridge and schema worker
        working-directory: contrib/build-a-vault/target/studio
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build:desktop
      - name: Execute every custody recipe through Studio
        working-directory: contrib/build-a-vault/target/studio
        run: >-
          node --import tsx "$GITHUB_WORKSPACE/contrib/build-a-vault/studio-check.ts"
          --studio "$PWD"
          --cli "$GITHUB_WORKSPACE/target/debug/sapio-cli"
          --workspace "$RUNNER_TEMP/build-a-vault-modules"
          --artifacts "$RUNNER_TEMP/build-a-vault"
      - name: Upload generated modules, Studio patches and contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-a-vault
          path: ${{ runner.temp }}/build-a-vault
          retention-days: 14
