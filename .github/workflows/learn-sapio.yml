name: Publish book

on:
  push:
    branches: [master]
    paths: ["docs/learn-sapio/**", ".github/workflows/learn-sapio.yml", "rust-toolchain.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: mdbook build docs/learn-sapio
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/learn-sapio/book
          cname: learn.sapio-lang.org
