[package]
rust-version.workspace = true
name = "sapio-base"
version = "0.2.4"
license = "MPL-2.0"
authors = ["Jeremy Rubin <j@rubin.io>"]
edition = "2021"
repository = "https://github.com/sapio-lang/sapio"
homepage = "https://sapio-lang.org"
description = "Sapio Base functionalities and trait definitions."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
schemars = "0.8.0"
serde_json = "1.0"
serde = "1.0"
serde_derive = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sapio-wasm = { path = "../wasm", version = "0.2.4" }

[dependencies.miniscript]
version = "=13.1.0"
features = ['compiler', 'serde']

[dependencies.bitcoin]
version = "=0.32.102"
features = ['serde']
