[package]
rust-version.workspace = true
name = "sapio-base"
version = "0.2.4"
license = "MPL-2.0"
authors = ["Jeremy Rubin <j@rubin.io>"]
edition = "2021"
repository = "https://github.com/sapio-lang/sapio"
homepage = "https://sapio-lang.org"
description = "Sapio Base functionalities and trait definitions."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
schemars = { version = "=1.2.2", features = ["bitcoin032", "miniscript13"] }
serde_json = "1.0"
serde = "1.0"
serde_derive = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sapio-wasm = { path = "../wasm", version = "0.2.4" }

[dependencies.miniscript]
version = "=13.1.0"
features = ['compiler', 'serde']

[dependencies.bitcoin]
version = "=0.32.102"
features = ['serde']

# Enables the process-wide SECP256K1 global context; version follows bitcoin's.
[dependencies.secp256k1]
version = "0.29.0"
default-features = false
features = ['global-context']
